<div class="overlay">
  <div class="panel">
    <h1 class="ar-glow-text">LEVEL COMPLETE!</h1>

    <div class="stars">
      @for (filled of starArray; track $index) {
        <ion-icon [name]="filled ? 'star' : 'star-outline'"></ion-icon>
      }
    </div>

    <div class="stats">
      <div class="stat">
        <span class="label">Score</span>
        <span class="value">{{ score | number }}</span>
      </div>
      <div class="stat">
        <span class="label">Coins Earned</span>
        <span class="value gold"><app-coin-icon></app-coin-icon>{{ coinsEarned }}</span>
      </div>
      <div class="stat">
        <span class="label">Time</span>
        <span class="value">{{ formattedTime }}</span>
      </div>
    </div>

    <div class="actions">
      @if (hasNextLevel) {
        <ion-button expand="block" color="primary" (click)="nextLevel.emit()">
          Next Level
        </ion-button>
      }
      <ion-button expand="block" fill="outline" (click)="replay.emit()">Replay</ion-button>
      <ion-button expand="block" fill="clear" (click)="levelMap.emit()">Level Map</ion-button>
    </div>
  </div>
</div>
