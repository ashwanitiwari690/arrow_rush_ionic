<div class="overlay">
  <div class="panel">
    <h1>GAME OVER</h1>
    <p>Out of time or out of moves. Give it another shot!</p>

    <div class="actions">
      @if (!isDailyChallenge) {
        <ion-button expand="block" color="primary" [disabled]="isProcessingAd" (click)="retry.emit()">Retry</ion-button>
      }
      @if (adAvailable && !isDailyChallenge) {
        <ion-button
          expand="block"
          fill="outline"
          [disabled]="isProcessingAd"
          (click)="watchAdAndContinue.emit()"
        >
          {{ isProcessingAd ? 'Loading Ad…' : 'Watch Ad for +1 Life & Retry' }}
        </ion-button>
      }
      <ion-button expand="block" fill="clear" [disabled]="isProcessingAd" (click)="levelMap.emit()">
        {{ isDailyChallenge ? 'Back to Daily Challenge' : 'Level Map' }}
      </ion-button>
    </div>
  </div>
</div>
